<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiencia Interactiva</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0c0d10; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    .card { max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #a1a1aa; margin-bottom: 12px; }
    .btn { display: block; padding: 15px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: transform 0.15s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-ar { background: #fff; color: #000; box-shadow: 0 4px 20px rgba(255,255,255,0.15); }
    .btn-portfolio { background: #1f222a; color: #fff; border: 1px solid #2e3340; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Experiencia Interactiva</h1>
    <p>Selecciona una opción para continuar:</p>
    <a href="ar.html" class="btn btn-ar">Ver Realidad Aumentada</a>
    <a href="https://tu-portafolio.com" class="btn btn-portfolio" target="_blank" rel="noopener">Ir al Portafolio</a>
  </div>
</body>
</html>
