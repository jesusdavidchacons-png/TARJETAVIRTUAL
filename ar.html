<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Experiencia AR - CAMIMPEG</title>
  
  <!-- Librerías con versiones 100% compatibles -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Botón flotante para regresar */
    #back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      text-decoration: none;
    }

    /* Mensaje guía inferior */
    #instruction-card {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 10px 20px;
      color: #fff;
      font-size: 0.85rem;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
  </style>
</head>
<body>

  <a href="index.html" id="back-btn">← Volver</a>

  <div id="instruction-card">
    <span class="pulse"></span>
    Apunta la cámara a la tarjeta
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video
        id="camimpeg-video"
        src="./camimpegreel.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: Tarjeta de presentación -->
    <a-entity mindar-image-target="targetIndex: 0" id="card-target">
      <a-video
        src="#camimpeg-video"
        position="0 0 0"
        height="1"
        width="1.6"
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const video = document.querySelector('#camimpeg-video');
    const cardTarget = document.querySelector('#card-target');

    // Desbloquear audio con el primer toque en cualquier parte de la pantalla
    document.body.addEventListener('click', () => {
      if (video.paused && !video.ended) {
        video.play().catch(() => {});
      }
    }, { once: true });

    // Control de video al detectar/perder la tarjeta física
    cardTarget.addEventListener('targetFound', () => {
      video.play().catch((err) => {
        console.warn('Playback bloqueado por el navegador hasta interacción:', err);
      });
    });

    cardTarget.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
