<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR CAMIMPEG</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    /* Forzar que el video que genera la cámara se muestre sí o sí */
    video:not(#camimpeg-video) {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: -2 !important;
      display: block !important;
    }

    /* Caja de diagnóstico en pantalla para ver el error real */
    #debug-box {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      border-radius: 8px;
      z-index: 999999;
      pointer-events: none;
      word-break: break-all;
    }

    #back-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10000;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div id="debug-box">Iniciando sistema...</div>
  <a href="index.html" id="back-btn">← Volver</a>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF:0.0001; filterBeta: 0.001;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video
        id="camimpeg-video"
        src="./camimpegreel.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="card-target">
      <a-video
        src="#camimpeg-video"
        position="0 0 0"
        height="1"
        width="1.6"
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const debugBox = document.querySelector('#debug-box');
    const log = (msg, isError = false) => {
      debugBox.innerHTML += `<br>${isError ? '<span style="color:#ff4d4d">✖ ' : '✔ '}${msg}</span>`;
    };

    // 1. Diagnóstico de HTTPS y Navegador
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      log('ERROR: La cámara requiere HTTPS obligatorio.', true);
    } else {
      log('HTTPS verificado.');
    }

    // 2. Verificar soporte de cámara WebRTC
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      log('Navegador no soporta cámara directa (¿In-App browser?). Abre en Safari/Chrome.', true);
    } else {
      log('Soporte de cámara detectado.');
    }

    // 3. Captura de eventos MindAR
    const sceneEl = document.querySelector('a-scene');
    const video = document.querySelector('#camimpeg-video');
    const cardTarget = document.querySelector('#card-target');

    sceneEl.addEventListener('renderstart', () => {
      log('Escena 3D iniciada.');
    });

    sceneEl.addEventListener('arReady', () => {
      log('¡MindAR listo! Cámara activa.');
    });

    sceneEl.addEventListener('arError', (event) => {
      log('Error al cargar targets.mind (verifica el archivo en el servidor).', true);
    });

    // Desbloquear audio con tap
    window.addEventListener('touchstart', () => {
      if (video.paused && !video.ended) {
        video.play().then(() => video.pause()).catch(() => {});
      }
    }, { once: true });

    cardTarget.addEventListener('targetFound', () => {
      log('Tarjeta detectada');
      video.play().catch(e => log('Error video: ' + e.message, true));
    });

    cardTarget.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
