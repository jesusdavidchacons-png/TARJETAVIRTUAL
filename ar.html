<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: white; font-family: sans-serif; text-align: center; padding: 20px;
    }
    #start-btn {
      margin-top: 15px; padding: 12px 28px; font-size: 16px; font-weight: bold;
      border-radius: 8px; border: none; background: #fff; color: #000; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Overlay para habilitar permisos de audio y video en iOS/Android -->
  <div id="overlay">
    <h2>Apunta la cámara a tu tarjeta</h2>
    <p>Toca el botón para activar la experiencia y el audio</p>
    <button id="start-btn">Iniciar Experiencia</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="ar-video" src="./showreel.mp4" preload="auto" loop playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- El plane se dimensiona según la relación de aspecto de la tarjeta física (ej. tarjeta estándar 1.6 de ratio) -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-card">
      <a-video src="#ar-video" position="0 0 0" height="1" width="1.6" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const overlay = document.querySelector('#overlay');
    const startBtn = document.querySelector('#start-btn');
    const video = document.querySelector('#ar-video');
    const targetCard = document.querySelector('#target-card');

    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      // Iniciar el sistema AR tras el gesto de usuario
      sceneEl.systems["mindar-image-system"].start();
    });

    targetCard.addEventListener("targetFound", () => {
      video.play();
    });

    targetCard.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>
</body>
</html>
